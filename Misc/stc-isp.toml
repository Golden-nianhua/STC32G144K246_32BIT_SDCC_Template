# STCForge stc-isp 配置
# 普通下载、带选项下载及 stc_info 共用。命令行显式传入的参数优先。

model = "STC32G144K246"
if = "usb"

[hardware]
# 这里的键名与 stc-isp 的硬件选项一致。
modify_hardware_options = true
cpu_mode = 32
clock_gain = "high"
por_reset_delay_long = true
reset_pin_as_io = true
low_voltage_reset_enabled = true
low_voltage_threshold = 0
watchdog_por_enabled = false
watchdog_prescale = 256
watchdog_stop_idle = true
eeprom_erase_enabled = true
cold_start_p32_p33_required = false
eeprom_kib = 2
user_system_enabled = false
user_system_kib = 0
verify_system_code = true
checksum_user_code = false
